services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bcp
      POSTGRES_PASSWORD: bcp
      POSTGRES_DB: bcp
    ports:
      - '5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bcp']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
