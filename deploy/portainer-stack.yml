# Portainer stack for the BCP analyzer: Postgres, the app and a Cloudflare Tunnel.
# Deploy it in Portainer as a stack from this Git repository (see docs/deploy/portainer.md).
# Every ${VARIABLE} comes from the stack's environment variables in Portainer; never commit them.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bcp
      POSTGRES_DB: bcp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - bcp-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bcp']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [bcp]

  app:
    build:
      # Relative to this file: the repository root.
      context: ..
      dockerfile: Dockerfile
    image: bcp-analyzer:latest
    # Rebuild on every deploy: Portainer CE's Git polling redeploys on a new commit, and without
    # this Compose would reuse the image built from the old code.
    pull_policy: build
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://bcp:${POSTGRES_PASSWORD}@db:5432/bcp
      AUTH_REQUIRED: 'true'
      # Own logins: needs SESSION_SECRET. Signing in through Cloudflare Access instead: set the
      # ACCESS_* variables and ADMIN_EMAILS (see docs/deploy/portainer.md); SESSION_SECRET and
      # ADMIN_PASSWORD are then unused.
      SESSION_SECRET: ${SESSION_SECRET:-}
      ACCESS_TEAM_DOMAIN: ${ACCESS_TEAM_DOMAIN:-}
      ACCESS_AUD: ${ACCESS_AUD:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # Email to the admins (someone new waiting, the daily to-do): off until SMTP_USER and
      # SMTP_PASSWORD are set (see docs/deploy/portainer.md).
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      NOTIFY_EMAILS: ${NOTIFY_EMAILS:-}
      DIGEST_HOUR: ${DIGEST_HOUR:-6}
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?set PUBLIC_HOSTNAME}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TOURNAMENT_SOURCE: bcp
      BCP_REFRESH_TOKEN: ${BCP_REFRESH_TOKEN:?set BCP_REFRESH_TOKEN}
      MIN_EVENT_ROUNDS: ${MIN_EVENT_ROUNDS:-4}
      MIN_EVENT_PLAYERS: ${MIN_EVENT_PLAYERS:-20}
      ELO_MIN_EVENT_ROUNDS: ${ELO_MIN_EVENT_ROUNDS:-3}
      ELO_MIN_EVENT_PLAYERS: ${ELO_MIN_EVENT_PLAYERS:-8}
      WH40K_ELO_ENABLED: ${WH40K_ELO_ENABLED:-true}
      FETCH_QUEUE_INTERVAL_MS: ${FETCH_QUEUE_INTERVAL_MS:-5000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # Published on the server's loopback only, for a cloudflared running directly on the server
    # (tunnel service URL http://localhost:3080). Not reachable from the LAN: login needs HTTPS,
    # and the rate limit trusts the visitor address Cloudflare adds.
    ports:
      - '127.0.0.1:${APP_PORT:-3080}:3000'
    networks: [bcp]

  # Optional: a cloudflared container for this stack. Only started with the "tunnel" profile
  # (COMPOSE_PROFILES=tunnel); skip it when cloudflared already runs on the server.
  tunnel:
    profiles: [tunnel]
    # Pinned so a redeploy never picks up an untested release; bump deliberately.
    image: cloudflare/cloudflared:2026.9.3
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on: [app]
    networks: [bcp]

volumes:
  bcp-pgdata:

networks:
  bcp:
