services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.7
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'true'
      xpack.security.autoconfiguration.enabled: 'false'
      xpack.security.http.ssl.enabled: 'false'
      xpack.ml.enabled: 'false'
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?set ELASTIC_PASSWORD}
      ES_JAVA_OPTS: '-Xms1g -Xmx1g'
    volumes:
      - elastic-data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.7
    restart: unless-stopped
    depends_on: [elasticsearch]
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_PASSWORD:?set KIBANA_PASSWORD}
      LOGIS_DASHBOARD_PASSWORD: ${LOGIS_DASHBOARD_PASSWORD:?set LOGIS_DASHBOARD_PASSWORD}
      XPACK_SECURITY_ENCRYPTIONKEY: ${KIBANA_SESSION_KEY:?set KIBANA_SESSION_KEY}
      TELEMETRY_ENABLED: 'false'
      XPACK_FLEET_ENABLED: 'false'
    volumes:
      - ./kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    ports:
      - '127.0.0.1:15601:5601'

  filebeat:
    image: docker.elastic.co/beats/filebeat:9.5.7
    restart: unless-stopped
    depends_on: [elasticsearch]
    user: root
    command: ['-e', '--strict.perms=false']
    environment:
      LOGIS_WRITER_PASSWORD: ${LOGIS_WRITER_PASSWORD:?set LOGIS_WRITER_PASSWORD}
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - filebeat-data:/usr/share/filebeat/data

volumes:
  elastic-data:
  filebeat-data:
